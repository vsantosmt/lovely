<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual da Noite Perfeita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Figtree:wght@400;600&display=swap">
<style>
:root{
  --bg:#fbf1ee; --card:#fffaf8; --fg:#3a1f26; --muted:#8a6770; --accent:#a8263f; --line:#ecd3d0; --glow:#f3c9c4;
  --display:'Fraunces',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b0f14; --card:#2a1820; --fg:#f6e6df; --muted:#b99aa0; --accent:#f0a35e; --line:#4a2a35; --glow:#5a2434; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0f14; --card:#2a1820; --fg:#f6e6df; --muted:#b99aa0; --accent:#f0a35e; --line:#4a2a35; --glow:#5a2434; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;box-sizing:border-box}
main{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{text-align:center}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;margin:.4rem 0 0;text-wrap:balance;font-weight:700}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;min-height:15rem;display:flex;flex-direction:column;gap:14px;justify-content:center}
.card .n{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card h2{font-family:var(--display);font-size:1.6rem;line-height:1.2;margin:0;font-weight:500;text-wrap:balance}
.card p{margin:0;line-height:1.55;font-size:1.05rem;max-width:65ch}
.card small{color:var(--muted)}
.nav{display:flex;gap:12px;justify-content:space-between}
button{font:inherit;font-weight:600;border-radius:10px;padding:12px 20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
button.go{background:var(--accent);border-color:var(--accent);color:var(--bg);flex:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.35;cursor:default}
.final{background:radial-gradient(120% 100% at 50% 0%,var(--glow),var(--card) 70%);text-align:center;align-items:center}
.final h2{font-size:2rem;font-style:italic}
.final .when{font-family:var(--display);font-size:1.15rem;color:var(--accent)}
.rsvp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reply{min-height:1.5em;color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){.card{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Manual de instruções · 7 passos · só para casados</div>
    <h1>Como preparar uma noite de casados</h1>
  </header>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <section class="card" id="card" aria-live="polite"></section>
  <div class="nav">
    <button id="back" type="button">Voltar</button>
    <button id="next" class="go" type="button">Próximo passo</button>
  </div>
</main>
<script>
var steps=[
 {t:"Verifique o equipamento",p:"Localize o marido. Ele costuma estar no sofá, com o celular, dizendo que “só vai ver uma coisinha”.",s:"Tempo estimado: 5 minutos. Na prática, 40."},
 {t:"Retire as distrações",p:"Coloque o celular no modo avião, a TV no mudo e a lista de tarefas da casa numa gaveta bem fundinha.",s:"Aviso: o lixo continuará existindo amanhã."},
 {t:"Confirme o fim da manutenção",p:"O sistema ficou alguns dias em período de atualização mensal. Agora a luz verde acendeu e o sistema voltou a funcionar normalmente.",s:"Nunca force a atualização antes da hora. Hoje já pode."},
 {t:"Prepare o ambiente",p:"Luz baixinha, lençol limpo, uma música boa e aquele cheirinho de quem se arrumou de propósito. Tranque a porta. Se tiver bichinho, ele dorme fora hoje.",s:"Atenção: velas são ótimas, mas não vale incendiar o quarto."},
 {t:"Faça o aquecimento",p:"Comece com elogio sincero, um beijo no pescoço e uma massagem sem pressa. As mãos precisam estar livres, e livres de celular.",s:"Tempo mínimo: o que ela quiser. Reclamar do relógio é proibido."},
 {t:"Convoque os brinquedos",p:"Abra a gaveta secreta e traga o kit do casal para a mesa de cabeceira. Confira se está tudo carregado, com pilha e funcionando.",s:"Passo crítico: nada estraga mais o clima do que a pilha acabar no meio."},
 {t:"Falta só um detalhe",p:"O manual está quase completo, mas falta a peça mais importante da noite inteira. Aperte o botão e descubra qual é.",s:"Sem ela, nada disso funciona."}
];
var i=0;
var card=document.getElementById('card'),prog=document.getElementById('prog'),back=document.getElementById('back'),next=document.getElementById('next');
function render(){
  var last=i===steps.length;
  prog.style.width=Math.round(i/steps.length*100)+'%';
  back.disabled=i===0;
  if(!last){
    var s=steps[i];
    card.className='card';
    card.innerHTML='<div class="n">Passo '+(i+1)+' de '+steps.length+'</div><h2>'+s.t+'</h2><p>'+s.p+'</p><small>'+s.s+'</small>';
    next.textContent=i===steps.length-1?'Revelar a peça final':'Próximo passo';
    next.hidden=false;
  }else{
    card.className='card final';
    card.innerHTML='<div class="n">Passo final</div><h2>A peça mais importante é você, meu amor</h2>'+
      '<p>Já passou o tempo de espera e eu estou morrendo de saudade de você. Hoje à noite eu quero a nossa cama, a luz baixinha e o kit completo na mesa de cabeceira. Vou te beijar devagar, cuidar de você do jeito que você gosta e, se quiser mandar em mim, eu obedeço. Só traga esse sorriso que eu adoro.</p>'+
      '<div class="when">Hoje, depois que a casa dormir. Eu te espero no quarto.</div>'+
      '<div class="rsvp"><button class="go" id="yes" type="button">Aceito, e já vou me arrumar</button><button id="think" type="button">Preciso de uns minutinhos</button></div>'+
      '<div class="reply" id="reply"></div>';
    next.hidden=true;
    var r=document.getElementById('reply');
    document.getElementById('yes').onclick=function(){r.textContent='Combinado! Hoje a noite é nossa.'};
    var t=document.getElementById('think');
    var n=0,msgs=['Tudo bem, pode se arrumar com calma.','Já está pronta? Eu estou ansioso...','Última chamada: o kit já está na mesa de cabeceira.'];
    t.onclick=function(){r.textContent=msgs[n%msgs.length];n++};
  }
}
next.onclick=function(){if(i<steps.length){i++;render()}};
back.onclick=function(){if(i>0){i--;render()}};
render();
</script>
</body></html>
